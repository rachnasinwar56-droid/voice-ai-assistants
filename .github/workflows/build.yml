name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Find Android Gradle file
        run: |
          echo "Android files:"
          find android -maxdepth 3 -type f | sort

      - name: Set Android minSdk 23
        shell: bash
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            echo "Using Kotlin Gradle file"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            echo "Using Groovy Gradle file"
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
          else
            echo "ERROR: Android Gradle file not found"
            find android -maxdepth 3 -type f | sort
            exit 1
          fi

      - name: Clean project
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
