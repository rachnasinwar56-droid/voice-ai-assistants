name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Flutter Version
        run: |
          flutter --version
          dart --version

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.voiceai \
            .

      - name: Configure Android
        shell: bash
        run: |
          set -e

          echo "Checking Android files..."
          find android -maxdepth 3 -type f | sort

          if [ -f "android/app/build.gradle.kts" ]; then
            echo "Kotlin DSL detected"

            python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 23"
          )

          s = s.replace(
              "minSdkVersion = flutter.minSdkVersion",
              "minSdkVersion = 23"
          )

          p.write_text(s)
          PY

          elif [ -f "android/app/build.gradle" ]; then
            echo "Groovy Gradle detected"

            sed -i \
              's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' \
              android/app/build.gradle

            sed -i \
              's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' \
              android/app/build.gradle

          else
            echo "ERROR: Android Gradle file not found"
            exit 1
          fi

          echo "Checking minSdk..."
          grep -R "minSdk" android/app/ || true

      - name: Pin compatible audio_session
        run: |
          cat >> pubspec.yaml <<'EOF'

          dependency_overrides:
            audio_session: 0.2.3
          EOF

          echo "Final pubspec.yaml:"
          cat pubspec.yaml

      - name: Clean
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool

      - name: Get dependencies
        run: |
          flutter pub get
          flutter pub deps

      - name: Build Release APK
        run: |
          flutter build apk --release

      - name: Verify APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-ai-assistant-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
